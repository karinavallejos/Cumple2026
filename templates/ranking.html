<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Casino Cumpleaños</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="background: black; color: white;">
    <div class="header-vegas">
        <img src="/static/logo-vegas.svg" alt="Las Vegas" style="width: 150px;">
    </div>
    
    <h1 style="color: gold; text-shadow: 2px 2px 4px #000;">🏆 TABLA DE POSICIONES</h1>

    <div style="padding: 10px; max-width: 500px; margin: auto;">
        <table style="width: 100%; border-collapse: collapse; background: #222; border-radius: 15px; overflow: hidden; border: 2px solid gold;">
            <thead style="background: gold; color: black;">
                <tr>
                    <th style="padding: 15px;">#</th>
                    <th style="padding: 15px; text-align: left;">JUGADOR</th>
                    <th style="padding: 15px; text-align: right;">PUNTOS</th>
                </tr>
            </thead>
            <tbody>
                {% for player in ranking %}
                <tr style="border-bottom: 1px solid #444;">
                    <td style="padding: 12px; font-weight: bold; color: gold;">{{ loop.index }}</td>
                    <td style="padding: 12px; text-align: left; font-size: 1.1rem;">{{ player[0] }}</td>
                    <td style="padding: 12px; text-align: right; color: lime; font-weight: bold;">${{ player[1].puntos }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div style="margin-top: 30px;">
        <a href="/juego" style="display: inline-block; padding: 12px 25px; background: #ffcc00; color: black; text-decoration: none; border-radius: 10px; font-weight: bold;">
            VOLVER AL JUEGO
        </a>
    </div>
</body>
</html>
