<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ranking Casino</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <h1 style="color: gold;">🏆 TOP JUGADORES 🏆</h1>
    <table id="tablaRanking" style="width: 90%; margin: auto; font-size: 1.5rem; border-collapse: collapse;">
        <tr style="border-bottom: 2px solid gold;">
            <th>Jugador</th>
            <th>Dinero</th>
        </tr>
        </table>
    <br>
    <button onclick="window.location.href='/juego'" class="apuesta-btn" style="width: auto; padding: 0 20px;">Volver al Juego</button>

    <script>
        const socket = io();
        socket.on('round_result', (data) => {
            const tabla = document.getElementById('tablaRanking');
            // Limpiar tabla excepto encabezado
            tabla.innerHTML = '<tr style="border-bottom: 2px solid gold;"><th>Jugador</th><th>Dinero</th></tr>';
            
            // Ordenar jugadores por puntos
            const sorted = Object.entries(data.players).sort((a,b) => b[1].puntos - a[1].puntos);
            
            sorted.forEach(([name, info]) => {
                const row = tabla.insertRow();
                row.innerHTML = `<td>${name}</td><td style="color:lime">$${info.puntos}</td>`;
            });
        });
    </script>
</body>
</html>
