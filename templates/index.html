        <button onclick="login()" class="apuesta-btn" 
                style="width: 220px; border-radius: 10px; height: 55px; cursor: pointer; font-weight: bold; font-size: 1.1rem; border: none; background: #ffcc00; color: black; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);">
            ¡EMPEZAR A JUGAR!
        </button>

    </div>

    <script>
        function login() {
            const select = document.getElementById('playerName');
            const name = select.value;

            if (name !== "") {
                // Guardamos el nombre seleccionado para recordarlo en el juego
                localStorage.setItem('casino_name', name);
                window.location.href = "/juego";
            } else {
                alert("Por favor, selecciona tu nombre de la lista.");
            }
        }

        // Si ya se registró antes, lo mandamos directo al juego
        window.onload = function() {
            if (localStorage.getItem('casino_name')) {
                window.location.href = "/juego";
            }
        }
    </script>
