<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Cumpleaños - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header-vegas">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Welcome_to_Fabulous_Las_Vegas.svg" alt="Las Vegas" style="width: 100%;">
    </div>
    <h2>INGRESA TU NOMBRE</h2>
    <input type="text" id="playerName" placeholder="Tu nombre aquí..." style="padding: 10px; font-size: 1.2rem; border-radius: 10px; border: none;">
    <br><br>
    <button onclick="login()" class="apuesta-btn" style="width: 200px; border-radius: 10px;">¡ENTRAR A JUGAR!</button>

    <script>
        function login() {
            const name = document.getElementById('playerName').value;
            if (name.trim() !== "") {
                localStorage.setItem('casino_name', name);
                window.location.href = "/juego";
            } else {
                alert("Por favor, pon tu nombre.");
            }
        }
    </script>
</body>
</html>
