<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Cumpleaños - Registro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="margin: 0; background-color: black; overflow: hidden;">

    <!-- Contenedor Flexbox para centrar todo -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 20px; box-sizing: border-box;">
        
        <div class="header-vegas">
            <!-- Logo local guardado en /static/ -->
            <img src="/static/logo-vegas.svg" alt="Las Vegas" style="width: 250px; max-width: 80vw;">
        </div>

        <h2 style="color: gold; margin: 0; font-family: sans-serif; text-shadow: 2px 2px 4px #000;">¿QUIÉN ERES?</h2>
        
        <!-- Lista desplegable en lugar de cuadro de texto -->
        <select id="playerName" ...>
            <option value="" disabled selected>Selecciona tu nombre...</option>
            
            <!-- PEGA AQUÍ TU LISTA DE 45 INVITADOS -->
            <option value="Karina">Karina</option>
            <option value="Poly">Poly</option>
            <option value="Pedro">Pedro</option>
            <option value="Arturo">Arturo</option>
            <option value="Mike">Mike</option>
            <option value="Marianela">Marianela</option>
            <option value="Michelle">Michelle</option>
            <option value="Katty">Katty</option>
            <option value="Pame">Pame</option>
            <!-- ... sigue agregando todos los nombres -->

        </select>
        
        <button onclick="login()" class="apuesta-btn" 
                style="width: 220px; border-radius: 10px; height: 55px; cursor: pointer; font-weight: bold; font-size: 1.1rem; border: none; background: #ffcc00; color: black; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);">
            ¡EMPEZAR A JUGAR!
        </button>

    </div>

    <script>
        function login() {
            const select = document.getElementById('playerName');
            const name = select.value;

            if (name !== "") {
                // Guardamos el nombre seleccionado para recordarlo en el juego
                localStorage.setItem('casino_name', name);
                window.location.href = "/juego";
            } else {
                alert("Por favor, selecciona tu nombre de la lista.");
            }
        }

        // Si ya se registró antes, lo mandamos directo al juego
        window.onload = function() {
            if (localStorage.getItem('casino_name')) {
                window.location.href = "/juego";
            }
        }
    </script>
</body>
</html>
