<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Casino Cumpleaños</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        h1 { color: gold; text-align: center; border-bottom: 2px solid gold; padding-bottom: 10px; }
        .control-group { border: 1px solid gold; padding: 15px; margin-bottom: 20px; border-radius: 10px; background: #262626; }
        h3 { margin-top: 0; color: #ffcc00; }
        button { padding: 10px 15px; cursor: pointer; background: gold; border: none; font-weight: bold; border-radius: 5px; transition: 0.3s; margin: 5px 0; }
        button:hover { background: #ffcc00; transform: scale(1.05); }
        input, select { padding: 10px; border-radius: 5px; border: 1px solid gold; background: #333; color: white; margin-bottom: 10px; }
        ul { list-style: none; padding: 0; }
        li { background: #333; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid gold; }
        .btn-delete { background: #ff4444; color: white; padding: 5px 10px; font-size: 0.8rem; }
        .btn-delete:hover { background: #cc0000; }
        .btn-gift { background: #00f2ff; color: black; }
        .btn-resolve { background: #00ff00; color: black; width: 100%; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>🎰 PANEL DE CONTROL DE DINÁMICAS</h1>

    <div class="control-group">
        <h3>1. Cambiar Juego (Visual de Invitados)</h3>
        <button onclick="cambiarVisual('dados', ['1','2','3','4','5','6'])">🎲 ACTIVAR DADOS (1-6)</button>
        <button onclick="cambiarVisual('cartas', ['❤️','💎','🍀','♠️'])">🃏 ACTIVAR CARTAS (Pintas)</button>
        <button onclick="cambiarVisual('especial', ['ROJO','NEGRO'])">🔴 ACTIVAR COLORES</button>
    </div>

    <div class="control-group">
    <h3>2. Resolver Ronda</h3>
    <div id="botones-resolucion" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px;">
        </div>
    <p><i>Selecciona el ganador arriba y presiona pagar.</i></p>
    <input type="hidden" id="resultadoGanador">
    <button onclick="resolver()" class="btn-resolve">💵 PAGAR AHORA</button>
</div>

<script>
    // Esta función crea los botones para que el admin solo haga click
    socket.on('new_game', (data) => {
        const contenedor = document.getElementById('botones-resolucion');
        contenedor.innerHTML = "";
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.style.width = "60px";
            btn.onclick = () => {
                document.getElementById('resultadoGanador').value = opt;
                // Feedback visual para el admin
                document.querySelectorAll('#botones-resolucion button').forEach(b => b.style.border = "none");
                btn.style.border = "4px solid lime";
            };
            contenedor.appendChild(btn);
        });
    });
</script>
<div class="control-group">
    <h3>3. Control de Rondas</h3>
    <button onclick="socket.emit('admin_next_round')" style="background: orange; width: 100%;">
        ¡EMPEZAR SIGUIENTE RONDA!
    </button>
    <p><i>Usa esto después de pagar para habilitar las apuestas de nuevo.</i></p>
</div>
    <div class="control-group">
        <h3>👥 Jugadores Conectados</h3>
        <ul id="lista-admin-jugadores">
            </ul>
    </div>

    <div class="control-group">
        <h3>💰 Otorgar Monto Específico</h3>
        <select id="select-jugadores">
            <option value="">Selecciona un jugador...</option>
        </select>
        <input type="number" id="monto-regalo" placeholder="Monto $" style="width: 100px;">
        <button onclick="darDineroEspecifico()" class="btn-gift">OTORGAR REGALO</button>
        <hr style="border: 0.5px solid #444; margin: 15px 0;">
        <button onclick="darDineroAzar()" style="background: cyan; color: black; width: 100%;">🎁 DAR BONO AL AZAR A TODOS</button>
    </div>

    <div class="control-group" style="border-color: #ff4444;">
        <h3 style="color: #ff4444;">⚠️ Zona de Peligro</h3>
        <button onclick="resetTodo()" style="background: #ff4444; color: white; width: 100%;">🔥 REINICIAR TODO EL JUEGO (BORRAR TODO)</button>
    </div>

    <script>
        const socket = io();

        // Escucha actualizaciones del servidor para refrescar la lista de jugadores y el menú desplegable
        socket.on('round_result', (data) => {
            const lista = document.getElementById('lista-admin-jugadores');
            const select = document.getElementById('select-jugadores');
            
            lista.innerHTML = "";
            select.innerHTML = '<option value="">Selecciona un jugador...</option>';
            
            Object.keys(data.players).forEach(name => {
                // Actualizar lista visual con botón de eliminar [cite: 366]
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>👤 <b>${name}</b>: $${data.players[name].puntos}</span>
                    <button onclick="eliminarJugador('${name}')" class="btn-delete">ELIMINAR</button>
                `;
                lista.appendChild(li);

                // Actualizar menú desplegable para regalos [cite: 363]
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        });

        function cambiarVisual(tipo, ops) {
            socket.emit('admin_change_view', { view: tipo, options: ops });
            alert("Pantalla de invitados cambiada a: " + tipo.toUpperCase());
        }

        function resolver() {
            const res = document.getElementById('resultadoGanador').value;
            if(res) {
                socket.emit('admin_resolve', { ganador: res });
                document.getElementById('resultadoGanador').value = ""; // Limpiar input
                alert("Ronda pagada. Ganador: " + res);
            } else {
                alert("Por favor escribe el resultado.");
            }
        }

        function eliminarJugador(nombre) {
            if(confirm(`¿Estás seguro de eliminar a ${nombre}? El jugador será expulsado.`)) {
                socket.emit('admin_remove_player', { name: nombre });
            }
        }

        function darDineroEspecifico() {
            const nombre = document.getElementById('select-jugadores').value;
            const monto = document.getElementById('monto-regalo').value;
            if(nombre && monto) {
                socket.emit('admin_give_money_specific', { name: nombre, monto: monto });
                document.getElementById('monto-regalo').value = ""; // Limpiar input
                alert(`Se han entregado $${monto} a ${nombre}`);
            } else {
                alert("Selecciona un jugador e ingresa un monto válido.");
            }
        }

        function darDineroAzar() {
            socket.emit('admin_give_random');
            alert("¡Se ha repartido un bono sorpresa a todos!");
        }

        function resetTodo() {
            if(confirm("¡ADVERTENCIA! Esto borrará a todos los jugadores y sus puntos. Todos deberán registrarse de nuevo. ¿Continuar?")) {
                socket.emit('admin_reset_all');
            }
        }
    </script>
</body>
</html>
