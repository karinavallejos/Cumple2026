<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Casino</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #222; color: white; font-family: sans-serif; padding: 20px; }
        .control-group { border: 1px solid gold; padding: 15px; margin-bottom: 20px; border-radius: 10px; }
        button { padding: 10px; cursor: pointer; background: gold; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>CONTROL DEL CUMPLE</h1>

    <div class="control-group">
        <h3>1. Cambiar Juego (Visual de ellos)</h3>
        <button onclick="cambiarVisual('dados', ['1','2','3','4','5','6'])">DADOS (1-6)</button>
        <button onclick="cambiarVisual('cartas', ['❤️','💎','🍀','♠️'])">CARTAS (Pintas)</button>
        <button onclick="cambiarVisual('especial', ['ROJO','NEGRO'])">COLORES</button>
    </div>

    <div class="control-group">
        <h3>2. Resolver Ronda (Poner número/pinta que salió)</h3>
        <input type="text" id="resultadoGanador" placeholder="Ej: 4 o ❤️">
        <button onclick="resolver()" style="background: lime;">¡PAGAR APUESTAS!</button>
        <p><i>Si no apostaron, se les restarán 50 automáticamente.</i></p>
    </div>
    <div class="control-group">
    <h3>👥 Jugadores Conectados</h3>
    <ul id="lista-admin-jugadores" style="text-align: left; list-style: none; padding: 0;">
        </ul>
</div>

<div class="control-group">
    <h3>🎁 Acciones Especiales</h3>
    <button onclick="darDineroAzar()" style="background: cyan; color: black;">
        REGALAR DINERO AL AZAR
    </button>
</div>

<div class="control-group" style="border-color: red;">
    <h3>⚠️ REINICIO TOTAL</h3>
    <button onclick="resetTodo()" style="background: red; color: white;">
        REINICIAR TODO (BORRAR JUGADORES)
    </button>
</div>

<script>
    const socket = io();

    // Actualiza la lista de nombres que ves tú en el panel
    socket.on('round_result', (data) => {
        const lista = document.getElementById('lista-admin-jugadores');
        lista.innerHTML = "";
        Object.keys(data.players).forEach(name => {
            const li = document.createElement('li');
            li.innerHTML = `👤 <b>${name}</b>: $${data.players[name].puntos}`;
            lista.appendChild(li);
        });
    });

    function darDineroAzar() {
        socket.emit('admin_give_random');
        alert("¡Dinero repartido!");
    }

    function resetTodo() {
        if(confirm("¿Seguro? Todos deberán registrarse de nuevo desde el QR.")) {
            socket.emit('admin_reset_all');
        }
    }
</script>
    <script>
        const socket = io();
        function cambiarVisual(tipo, ops) {
            socket.emit('admin_change_view', { view: tipo, options: ops });
            alert("Visual cambiada a " + tipo);
        }
        function resolver() {
            const res = document.getElementById('resultadoGanador').value;
            if(res) {
                socket.emit('admin_resolve', { ganador: res });
                alert("Ronda resuelta: ganador " + res);
            }
        }
    </script>
</body>
</html>
