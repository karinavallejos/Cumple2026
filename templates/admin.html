<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Casino</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        h1 { color: gold; text-align: center; border-bottom: 2px solid gold; padding-bottom: 10px; }
        .control-group { border: 1px solid gold; padding: 15px; margin-bottom: 20px; border-radius: 10px; background: #262626; }
        h3 { margin-top: 0; color: #ffcc00; }
        button { padding: 12px; cursor: pointer; background: gold; border: none; font-weight: bold; border-radius: 5px; margin: 5px; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button.active-visual { outline: 3px solid #00ff00; box-shadow: 0 0 12px #00ff00; }
        .btn-confirm-visual { background: #00cc66; color: white; }
        .btn-resolve { background: #00ff00; width: 100%; margin-top: 10px; }
        .btn-next { background: #0088ff; color: white; width: 100%; margin-top: 10px; }
        .btn-reset-money { background: #ffcc00; color: black; width: 100%; margin-top: 10px; }
        .btn-reset-all { background: #ff4444; color: white; width: 100%; margin-top: 10px; }
        input, select { padding: 10px; border-radius: 5px; background: #333; color: white; border: 1px solid gold; }
        #contador-apuestas { font-size: 3rem; font-weight: bold; color: #00ffff; text-align: center; }
        #ronda-actual { font-size: 2rem; font-weight: bold; color: gold; text-align: center; margin-top: 8px; }
        #estado-ronda { color: #ffcc00; text-align: center; margin-top: 8px; }
        #visual-actual { margin-top: 10px; color: #00ff00; font-weight: bold; }
        #rapido-dulces { display: none; margin-top: 12px; padding: 12px; border: 1px solid #00cc66; border-radius: 8px; background: #102418; color: white; text-align: center; font-weight: bold; }
        .winner-btn { width: 60px; height: 60px; font-size: 1.5rem; border: 2px solid transparent; }
        .color-btn { color: transparent; text-shadow: none; }
        .btn-roulette { display: none; background: #9b5cff; color: white; width: 100%; margin-top: 10px; }
        .btn-buzzer { background: #ff0077; color: white; width: 100%; margin-top: 10px; }
        .btn-song { background: #00ffff; color: black; width: 100%; margin-top: 10px; }
        .buzzer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; }
        .table-score { border: 1px solid #555; border-radius: 8px; padding: 8px; background: #181818; }
        .buzz-row { display: grid; grid-template-columns: 34px 1fr 88px; gap: 8px; padding: 7px 0; border-bottom: 1px solid #333; align-items: center; }
    </style>
</head>
<body>
    <h1>Panel de Control</h1>

    <div class="control-group">
        <h3>Estado: Apuestas Confirmadas</h3>
        <div id="contador-apuestas">0/0</div>
        <div id="ronda-actual">Ronda 1</div>
        <div id="estado-ronda">Esperando inicio de ronda</div>
    </div>

    <div class="control-group">
        <h3>1. Elegir Visual</h3>
        <button type="button" data-visual="dados" onclick="cambiarVisual('dados', ['1','2','3','4','5','6'])">DADOS</button>
        <button type="button" data-visual="cartas" onclick="cambiarVisual('cartas', ['\u2665','\u2666','\u2663','\u2660'])">CARTAS</button>
        <button type="button" data-visual="especial" onclick="cambiarVisual('especial', ['ROJO','NEGRO','VERDE','AZUL','BLANCO','AMARILLO'])">RULETA</button>
        <button type="button" data-visual="dulces" onclick="cambiarVisual('dulces', ['35','36','37','38','39','40','41','42'])">DULCES</button>
        <button type="button" class="btn-confirm-visual" onclick="confirmarVisual()">CONFIRMAR VISUAL</button>
        <div id="visual-actual">Visual actual: sin seleccionar</div>
    </div>

    <div class="control-group">
        <h3>2. Resolver Ronda</h3>
        <div id="botones-resolucion" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;"></div>
        <input type="text" id="resultadoGanador" readonly style="width: 90%; text-align: center; margin-top: 10px;">
        <div id="rapido-dulces"></div>
        <button type="button" onclick="activarRuleta()" class="btn-roulette">ACTIVAR RULETA</button>
        <button type="button" onclick="resolver()" class="btn-resolve">PAGAR Y FINALIZAR RONDA</button>
        <button type="button" onclick="siguienteRonda()" class="btn-next">INICIAR SIGUIENTE RONDA</button>
    </div>

    <div class="control-group">
        <h3>Jugadores</h3>
        <ul id="lista-admin-jugadores"></ul>
        <select id="select-jugadores"></select>
        <input type="number" id="monto-regalo" placeholder="$">
        <button type="button" onclick="darDineroEspecifico()">DAR BONO</button>
    </div>

    <div class="control-group">
        <h3>Reinicios</h3>
        <button type="button" onclick="reiniciarMontos()" class="btn-reset-money">REINICIAR MONTOS A $1000</button>
        <button type="button" onclick="reiniciarJuegoCompleto()" class="btn-reset-all">REINICIAR JUEGO COMPLETO</button>
    </div>

    <div class="control-group">
        <h3>Chicharra</h3>
        <div id="buzzer-admin-status">Inactiva</div>
        <button type="button" onclick="activarPanelChicharra()" class="btn-buzzer">ACTIVAR PANEL CHICHARRA</button>
        <button type="button" onclick="desactivarPanelChicharra()" class="btn-reset-all">VOLVER A APUESTAS</button>
        <button type="button" onclick="iniciarCancion()" class="btn-song">HABILITAR CHICHARRA / NUEVA CANCION</button>
        <button type="button" onclick="cerrarCancionSinPunto()" class="btn-reset-money">BLOQUEAR SIN PUNTO</button>
        <h3 style="margin-top: 18px;">Orden de chicharra</h3>
        <div id="buzzer-lista"></div>
        <h3 style="margin-top: 18px;">Puntos por mesa</h3>
        <div id="buzzer-mesas" class="buzzer-grid"></div>
    </div>

    <script>
        const socket = io();
        let gameStatus = "esperando";
        let gameRound = 1;
        let currentView = "ninguna";
        let visualPendiente = null;
        let buzzerState = null;
        const mesasChicharra = ['Elvis', 'Circus', 'Bellagio', 'All in', 'Flamingo', 'Jackpot', 'Luxor'];
        const colorStyles = {
            ROJO: { background: "#d71920", color: "#d71920", border: "#ffb3b3" },
            NEGRO: { background: "#050505", color: "#050505", border: "#ffffff" },
            VERDE: { background: "#00a651", color: "#00a651", border: "#c7ffd8" },
            AZUL: { background: "#0077ff", color: "#0077ff", border: "#cce3ff" },
            BLANCO: { background: "#ffffff", color: "#ffffff", border: "#999999" },
            AMARILLO: { background: "#ffd400", color: "#ffd400", border: "#fff2a0" }
        };

        const estadoTexto = {
            esperando: "Esperando que inicies la ronda",
            preparando: "Ronda iniciada: ahora elige una visual",
            apostando: "Visual activa: jugadores pueden apostar",
            finalizada: "Ronda finalizada: inicia la siguiente"
        };

        socket.on('actualizar_contador', (data) => {
            document.getElementById('contador-apuestas').innerText = data.conteo;
        });

        socket.on('new_game', (data) => {
            actualizarEstadoJuego(data);
        });

        socket.on('round_result', (data) => {
            actualizarLista(data.players);
            if (data.ganador) document.getElementById('resultadoGanador').value = data.ganador;
            mostrarRapidoDulces(data.ganador_rapido_dulces);
        });

        socket.on('roulette_spin', (data) => {
            document.getElementById('resultadoGanador').value = "RULETA GIRANDO...";
            document.querySelector('.btn-roulette').disabled = true;
        });

        socket.on('update_data', (data) => {
            actualizarLista(data.players);
        });

        socket.on('admin_update', (data) => {
            actualizarLista(data.players);
            if (data.game) actualizarEstadoJuego(data.game);
        });

        socket.on('admin_buzzer_update', (data) => {
            actualizarChicharraAdmin(data);
        });

        socket.on('buzzer_state', (data) => {
            actualizarChicharraAdmin(data);
        });

        socket.on('state_update', (data) => {
            actualizarLista(data.players);
            if (data.game) actualizarEstadoJuego(data.game);
            if (data.conteo) document.getElementById('contador-apuestas').innerText = data.conteo;
        });

        socket.on('admin_error', (data) => {
            alert(data.message || "Accion no permitida en esta etapa de la ronda.");
        });

        function actualizarEstadoJuego(game) {
            gameStatus = game.status || "esperando";
            gameRound = game.ronda || 1;
            currentView = game.view || "ninguna";
            if (gameStatus !== "preparando") visualPendiente = null;
            if (gameStatus !== "finalizada") limpiarRapidoDulces();
            document.getElementById('ronda-actual').innerText = `Ronda ${gameRound}`;
            document.getElementById('estado-ronda').innerText = estadoTexto[gameStatus] || gameStatus;
            marcarVisualActiva(visualPendiente ? visualPendiente.view : game.view);
            renderizarBotonesResolucion(game.options || []);
            actualizarControlesRonda();
        }

        function actualizarControlesRonda() {
            const puedeElegirVisual = gameStatus === "preparando";
            const puedeResolver = gameStatus === "apostando";
            const puedeIniciar = gameStatus === "esperando" || gameStatus === "finalizada";
            const esRuleta = currentView === "especial";

            document.querySelectorAll('[data-visual]').forEach(btn => {
                btn.disabled = !puedeElegirVisual;
            });

            document.querySelectorAll('.winner-btn').forEach(btn => {
                btn.disabled = !puedeResolver;
            });

            document.querySelector('.btn-resolve').disabled = !puedeResolver || esRuleta;
            document.querySelector('.btn-next').disabled = !puedeIniciar;
            document.querySelector('.btn-confirm-visual').disabled = !puedeElegirVisual || !visualPendiente;
            document.querySelector('.btn-roulette').style.display = esRuleta ? 'block' : 'none';
            document.querySelector('.btn-roulette').disabled = !(puedeResolver && esRuleta);
        }

        function actualizarLista(players) {
            const lista = document.getElementById('lista-admin-jugadores');
            const select = document.getElementById('select-jugadores');
            lista.innerHTML = "";
            select.innerHTML = '<option value="">Seleccionar...</option>';

            Object.keys(players).forEach(name => {
                const jugador = players[name];
                const estado = jugador.aposto ? ' listo' : ' esperando';

                const li = document.createElement('li');
                li.innerText = `${name}: $${jugador.puntos} (${estado})`;
                lista.appendChild(li);

                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        }

        function renderizarBotonesResolucion(options) {
            const contenedor = document.getElementById('botones-resolucion');
            contenedor.innerHTML = "";
            document.getElementById('resultadoGanador').value = "";

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = "winner-btn";
                btn.innerText = opt;
                aplicarEstiloColor(btn, opt);
                btn.onclick = () => {
                    document.getElementById('resultadoGanador').value = opt;
                    document.querySelectorAll('.winner-btn').forEach(b => b.style.border = "2px solid transparent");
                    btn.style.border = "4px solid #00ff00";
                };
                contenedor.appendChild(btn);
            });
            actualizarControlesRonda();
        }

        function marcarVisualActiva(view) {
            document.querySelectorAll('[data-visual]').forEach(btn => {
                btn.classList.toggle('active-visual', btn.dataset.visual === view);
            });
            const texto = nombreVisual(view);
            document.getElementById('visual-actual').innerText = `Visual actual: ${texto}`;
        }

        function nombreVisual(view) {
            if (!view || view === "ninguna") return "sin seleccionar";
            if (view === "especial") return "RULETA";
            return view.toUpperCase();
        }

        function cambiarVisual(view, options) {
            if (gameStatus !== "preparando") {
                alert("Primero inicia una ronda nueva.");
                return;
            }

            visualPendiente = { view, options };
            marcarVisualActiva(view);
            document.getElementById('visual-actual').innerText = `Visual a confirmar: ${nombreVisual(view)}`;
            actualizarControlesRonda();
        }

        function confirmarVisual() {
            if (gameStatus !== "preparando") {
                alert("Primero inicia una ronda nueva.");
                return;
            }

            if (!visualPendiente) {
                alert("Selecciona una visual antes de confirmar.");
                return;
            }

            socket.emit('admin_change_view', visualPendiente);
        }

        function resolver() {
            if (gameStatus !== "apostando") {
                alert("Primero inicia la ronda y elige una visual.");
                return;
            }

            const res = document.getElementById('resultadoGanador').value;
            if (res) socket.emit('admin_resolve', { ganador: res });
            else alert("Selecciona un ganador");
        }

        function siguienteRonda() {
            if (gameStatus !== "esperando" && gameStatus !== "finalizada") {
                alert("Primero paga y finaliza la ronda actual.");
                return;
            }

            socket.emit('admin_next_round');
            visualPendiente = null;
            limpiarRapidoDulces();
        }

        function activarRuleta() {
            if (gameStatus !== "apostando" || currentView !== "especial") {
                alert("La ruleta solo se puede activar en una ronda de colores.");
                return;
            }

            socket.emit('admin_spin_roulette');
        }

        function aplicarEstiloColor(btn, color) {
            const estilo = colorStyles[color];
            if (!estilo) return;

            btn.classList.add('color-btn');
            btn.style.background = estilo.background;
            btn.style.color = estilo.color;
            btn.style.borderColor = estilo.border;
        }

        function mostrarRapidoDulces(nombre) {
            const contenedor = document.getElementById('rapido-dulces');
            if (!contenedor || currentView !== "dulces") return;

            contenedor.style.display = 'block';
            contenedor.innerText = nombre
                ? `DULCES: respuesta ganadora mas rapida: ${nombre}`
                : "DULCES: nadie acerto la respuesta ganadora.";
        }

        function limpiarRapidoDulces() {
            const contenedor = document.getElementById('rapido-dulces');
            if (!contenedor) return;

            contenedor.style.display = 'none';
            contenedor.innerText = "";
        }

        function darDineroEspecifico() {
            const n = document.getElementById('select-jugadores').value;
            const m = document.getElementById('monto-regalo').value;
            if (n && m) socket.emit('admin_give_money_specific', { name: n, monto: m });
        }

        function reiniciarMontos() {
            if (confirm("Reiniciar dinero de todos a $1000 y volver a ronda 1?")) {
                socket.emit('admin_reset_money_only');
            }
        }

        function reiniciarJuegoCompleto() {
            if (confirm("Reiniciar todo el juego? Se borran jugadores, dinero y todos deberan registrarse de nuevo.")) {
                socket.emit('admin_reset_all');
            }
        }

        function activarPanelChicharra() {
            socket.emit('admin_activate_buzzer');
        }

        function desactivarPanelChicharra() {
            socket.emit('admin_deactivate_buzzer');
        }

        function iniciarCancion() {
            socket.emit('admin_start_song');
        }

        function cerrarCancionSinPunto() {
            socket.emit('admin_close_song');
        }

        function darPuntoMesa(table) {
            socket.emit('admin_award_buzzer_point', { table, delta: 1 });
        }

        function ajustarMesa(table, delta) {
            socket.emit('admin_adjust_table_score', { table, delta });
        }

        function actualizarChicharraAdmin(data) {
            if (!data) return;
            buzzerState = data;
            document.getElementById('buzzer-admin-status').innerText = data.active
                ? `Activa - Cancion ${data.song || 0} - ${data.enabled ? 'CHICHARRA HABILITADA' : 'bloqueada'}`
                : 'Inactiva';

            const lista = document.getElementById('buzzer-lista');
            lista.innerHTML = '';
            const primeros = (data.buzzes || []).slice(0, 15);
            if (primeros.length === 0) {
                lista.innerHTML = '<div style="color:#aaa;">Sin respuestas todavia.</div>';
            } else {
                primeros.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'buzz-row';
                    row.innerHTML = `
                        <strong style="color: gold;">${index + 1}</strong>
                        <span>${item.name} - ${item.table}<br><small>${item.elapsed}s</small></span>
                        <button type="button" onclick="darPuntoMesa('${item.table}')">+1 ${item.table}</button>
                    `;
                    lista.appendChild(row);
                });
            }

            const mesas = document.getElementById('buzzer-mesas');
            mesas.innerHTML = '';
            mesasChicharra.forEach(table => {
                const box = document.createElement('div');
                box.className = 'table-score';
                box.innerHTML = `
                    <strong>${table}</strong>
                    <div style="font-size: 1.6rem; color: gold;">${(data.tables || {})[table] || 0}</div>
                    <button type="button" onclick="ajustarMesa('${table}', 1)">+</button>
                    <button type="button" onclick="ajustarMesa('${table}', -1)">-</button>
                `;
                mesas.appendChild(box);
            });
        }

        socket.emit('admin_get_players');
        actualizarControlesRonda();
    </script>
</body>
</html>
